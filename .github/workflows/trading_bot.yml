name: Sala Operativa 10 Agenti

on:
  schedule:
    - cron: '*/30 * * * *'  # Si attiva automaticamente ogni 30 minuti
  workflow_dispatch:        # Ti permette anche di farlo partire manualmente quando vuoi

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run trading bot
        run: |
          python bot.py
